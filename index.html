<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת ייעוץ לימודים וקריירה חכמה</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap');
        body {
            font-family: 'Heebo', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-start p-4 md:p-8">

    <div class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden p-6 md:p-10">
        
        <!-- כותרת ראשית -->
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400 mb-2">
                מערכת ייעוץ לימודים וקריירה חכמה
            </h1>
            <p class="text-slate-400 text-sm md:text-base">
                שאלון אבחון מקצועי המשלב נתוני קבלה אמיתיים, סינון סף אקדמי והמלצות מותאמות אישית.
            </p>
        </header>

        <!-- אזור השאלון -->
        <div id="questionnaire-view" class="space-y-6">
            
            <!-- פרטים אישיים -->
            <div class="bg-indigo-950/40 p-4 rounded-xl border border-indigo-500/30 space-y-3">
                <h3 class="text-sm font-bold text-indigo-300">👤 פרטים אישיים:</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="qAge" class="block text-xs font-medium text-slate-300 mb-1">גיל:</label>
                        <input type="number" id="qAge" min="18" max="120" value="23" required 
                            class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label for="qField" class="block text-xs font-medium text-slate-300 mb-1">תחום לימודים מבוקש:</label>
                        <select id="qField" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                            <option value="computers">מדעי המחשב / הנדסת תוכנה</option>
                            <option value="engineering">הנדסה (מכונות, חשמל וכו')</option>
                            <option value="business">ניהול עסקי ויזמות</option>
                            <option value="education">חינוך והוראה</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- נתוני קבלה אקדמיים -->
            <div class="bg-indigo-950/60 p-4 rounded-xl border border-indigo-500/40 space-y-3">
                <h3 class="text-sm font-bold text-indigo-300">📊 נתוני קבלה אקדמיים (לסינון מוסדות לימוד מדויק):</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="qMatriculation" class="block text-xs font-medium text-slate-300 mb-1">ממוצע בגרות משוקלל (עם בונוסים):</label>
                        <input type="number" id="qMatriculation" min="60" max="125" step="0.1" value="78" required 
                            class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label for="qPsychometric" class="block text-xs font-medium text-slate-300 mb-1">ציון פסיכומטרי (או 0 אם ללא):</label>
                        <input type="number" id="qPsychometric" min="0" max="800" step="1" value="572" required 
                            class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                    <div>
                        <label for="qMathUnits" class="block text-xs font-medium text-slate-300 mb-1">יחידות וציון במתמטיקה:</label>
                        <select id="qMathUnits" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                            <option value="5-90">5 יחידות (ציון 90+)</option>
                            <option value="5-80">5 יחידות (ציון 80-89)</option>
                            <option value="5-70">5 יחידות (ציון 70-79)</option>
                            <option value="4-85">4 יחידות (ציון 85+)</option>
                            <option value="4-70">4 יחידות (ציון 70-84)</option>
                            <option value="3" selected>3 יחידות / אחר</option>
                        </select>
                    </div>
                    <div>
                        <label for="qPhysicsUnits" class="block text-xs font-medium text-slate-300 mb-1">היקף פיזיקה / מקצוע מדעי מוגבר:</label>
                        <select id="qPhysicsUnits" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                            <option value="5-physics">5 יחידות פיזיקה</option>
                            <option value="4-physics">4 יחידות פיזיקה / מדעי המחשב מוגבר</option>
                            <option value="none" selected>ללא פיזיקה מוגברת</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- כפתור הגשה -->
            <div class="text-center pt-4">
                <button onclick="processQuestionnaire()" class="px-8 py-3 bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white font-bold rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5">
                    הפק אבחון ונתוני קבלה מקצועיים
                </button>
            </div>
        </div>

        <!-- אזור תוצאות (מוסתר בהתחלה) -->
        <div id="results-view" class="hidden space-y-6 pt-4 border-t border-slate-800 mt-6">
            <h2 class="text-2xl font-bold text-cyan-300">תוצאות אבחון משוקלל וסיכויי קבלה:</h2>
            
            <div id="summary-metrics" class="bg-slate-800/60 p-4 rounded-xl border border-slate-700 text-sm leading-relaxed text-slate-300">
                <!-- נתונים מסוכמים -->
            </div>

            <div id="eligibility-box" class="p-4 rounded-xl border text-sm font-medium">
                <!-- סטטוס קבלה והמלצה מקצועית -->
            </div>

            <div class="text-center pt-4">
                <button onclick="resetForm()" class="px-6 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold rounded-lg transition-all">
                    חזרה לשאלון ותיקון נתונים
                </button>
            </div>
        </div>

    </div>

    <!-- לוגיקת ה-JavaScript המקצועית -->
    <script>
        function checkAdmissionEligibility(field, mathUnits, mat, psycho) {
            const [mathLevel, mathGrade] = mathUnits.split('-');
            const isMathLow = (mathLevel === '3' || (mathLevel === '4' && parseInt(mathGrade || 0) < 80));
            
            // בדיקת התאמה למדעי המחשב והנדסה
            if (field === 'computers' || field === 'engineering') {
                // תנאי סף מינימליים באוניברסיטאות ומכללות מובילות דורשים בגרות גבוהה מ-100 או פסיכומטרי גבוה בהרבה, ובמיוחד מתמטיקה חזקה
                if (mat < 95 || psycho < 600 || isMathLow) {
                    return {
                        status: 'rejected_direct',
                        className: 'bg-rose-950/40 border-rose-500/40 text-rose-200',
                        msg: '❌ אינו עומד בתנאי הסף הישירים לתואר ראשון במדעי המחשב / הנדסה (עקב שילוב של ממוצע בגרות/פסיכומטרי או רמת מתמטיקה שאינה עומדת בדרישות הסף האוניברסיטאיות).\n\n💡 המלצת יועץ מקצועית:\n1. השתלבות במסלול "הנדסאי תוכנה / אלקטרוניקה" (תעודת הנדסאי).\n2. פנייה למכינה קדם-אקדמית ייעודית (מדעית-הנדסית) להשלמת ושיפור בגרויות ומתמטיקה (4-5 יח"ל).'
                    };
                }
            }

            return {
                status: 'eligible',
                className: 'bg-emerald-950/40 border-emerald-500/40 text-emerald-200',
                msg: '✅ נתוני הקבלה תואמים את דרישות הסף הראשוניות למסלולים המבוקשים.'
            };
        }

        function processQuestionnaire() {
            const age = parseInt(document.getElementById('qAge').value) || 23;
            const field = document.getElementById('qField').value;
            const mat = parseFloat(document.getElementById('qMatriculation').value) || 78;
            const psycho = parseInt(document.getElementById('qPsychometric').value) || 572;
            const mathUnits = document.getElementById('qMathUnits').value;

            // סיכום נתונים
            let fieldNameHeb = "מדעי המחשב / הנדסת תוכנה";
            if (field === 'engineering') fieldNameHeb = "הנדסה";
            if (field === 'business') fieldNameHeb = "ניהול עסקי ויזמות";
            if (field === 'education') fieldNameHeb = "חינוך והוראה";

            document.getElementById('summary-metrics').innerHTML = `
                <p><strong>גיל:</strong> ${age}</p>
                <p><strong>ממוצע בגרות משוקלל:</strong> ${mat}</p>
                <p><strong>ציון פסיכומטרי:</strong> ${psycho}</p>
                <p><strong>תחום מבוקש:</strong> ${fieldNameHeb}</p>
            `;

            // בדיקת התאמה קפדנית
            const eligibility = checkAdmissionEligibility(field, mathUnits, mat, psycho);

            const eligibilityBox = document.getElementById('eligibility-box');
            eligibilityBox.className = `p-4 rounded-xl border text-sm font-medium whitespace-pre-line ${eligibility.className}`;
            eligibilityBox.innerText = eligibility.msg;

            // מעבר תצוגה
            document.getElementById('questionnaire-view').classList.add('hidden');
            document.getElementById('results-view').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('results-view').classList.add('hidden');
            document.getElementById('questionnaire-view').classList.remove('hidden');
        }
    </script>
</body>
</html>
