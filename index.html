<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Advisor & Learning Tool</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 24px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .hidden {
            display: none;
        }

        .results-view {
            margin-top: 20px;
        }

        .results-view h3 {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 20px;
            color: var(--text-main);
        }

        ul {
            padding-right: 20px;
        }

        li {
            margin-bottom: 10px;
        }

        a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>יועץ לימודים חכם - AI Study Advisor</h1>
        
        <!-- טופס קלט -->
        <div id="form-view">
            <div class="form-group">
                <label for="user-name">שם מלא:</label>
                <input type="text" id="user-name" placeholder="הכנס את שמך המלא">
            </div>
            
            <div class="form-group">
                <label for="field-select">תחום לימודים מבוקש:</label>
                <select id="field-select">
                    <option value="ai">פיתוח ובינה מלאכותית (AI)</option>
                    <option value="automation">אוטומציה וכלים מתקדמים</option>
                    <option value="general">יסודות תכנות ופיתוח תוכנה</option>
                </select>
            </div>

            <button id="submit-btn" onclick="generateResults()">קבל המלצות לימודים</button>
        </div>

        <!-- תצוגת תוצאות -->
        <div id="results-view" class="results-view hidden">
            <h3 id="greeting-title"></h3>
            <div id="recommendations-content"></div>
            <button style="margin-top: 20px; background-color: var(--text-muted);" onclick="resetForm()">חיפוש חדש</button>
        </div>
    </div>

    <script>
        // פונקציית ההמלצות המעודכנת עם כתובות אמיתיות וישירות
        function generateSpecificRecommendations() {
            let recs = {};
            recs.courses = [
                {
                    title: "LLM ואינטגרציית AI פיתוח יישומי",
                    school: "הטכניון - לימודי חוץ",
                    url: "https://www.technion.ac.il" 
                },
                {
                    title: "No-Code אוטומציה עסקית וכלי",
                    school: "האוניברסיטה הפתוחה",
                    url: "https://www.openu.ac.il" 
                }
            ];
            return recs;
        }

        function generateResults() {
            const name = document.getElementById('user-name').value || 'סטודנט יקר';
            const field = document.getElementById('field-select').value;
            
            document.getElementById('greeting-title').innerText = `שלום ${name}, הנה ההמלצות עבורך:`;
            
            const data = generateSpecificRecommendations();
            let htmlContent = `<p>בהתבסס על בחירתך בתחום (${field}), הנה קורסים מומלצים:</p><ul>`;
            
            data.courses.forEach(course => {
                htmlContent += `<li><strong>${course.title}</strong> (${course.school}) - <a href="${course.url}" target="_blank">מעבר לאתר הלימודים</a></li>`;
            });
            
            htmlContent += `</ul>`;
            
            document.getElementById('recommendations-content').innerHTML = htmlContent;
            
            // מעבר בין המסכים
            document.getElementById('form-view').classList.add('hidden');
            document.getElementById('results-view').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('results-view').classList.add('hidden');
            document.getElementById('form-view').classList.remove('hidden');
        }
    </script>
</body>
</html>
